<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开放文本语义理解</title><style>body{font-family:system-ui;margin:40px auto;max-width:900px;padding:0 20px;color:#172033}textarea{width:100%;min-height:150px;padding:12px;font-size:16px}button{margin:12px 8px 12px 0;padding:10px 18px;border:0;border-radius:6px;background:#2563eb;color:white;cursor:pointer}.card{background:#f5f7fb;padding:18px;border-radius:10px;margin-top:16px;white-space:pre-wrap}</style></head><body><h1>开放文本语义理解与分析</h1><p>输入一段文本，查看语言、情感、关键词等基础语义结果。</p><textarea id="text" placeholder="请输入文本..."></textarea><br><button onclick="analyze()">分析文本</button><div id="result" class="card">等待分析...</div><script>async function analyze(){const text=document.querySelector('#text').value;const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});document.querySelector('#result').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
